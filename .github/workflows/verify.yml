name: DNM v4.2 verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  javascript-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dnm_ci_only_not_a_real_password
          POSTGRES_DB: dnm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dnm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: dnm_ci_only_not_a_real_password
      PGDATABASE: dnm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Temporary Postgres - v3 compatibility and v4 workflows
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f database/01_schema.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/seed_v3.sql
          psql -v ON_ERROR_STOP=1 -f database/04_upgrade_v4.sql
          psql -v ON_ERROR_STOP=1 -f database/04_upgrade_v4.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/integration.sql
          psql -v ON_ERROR_STOP=1 -f database/06_upgrade_v4_1.sql
          psql -v ON_ERROR_STOP=1 -f database/06_upgrade_v4_1.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/integration_v41.sql
          psql -v ON_ERROR_STOP=1 -f database/08_upgrade_v4_2.sql
          psql -v ON_ERROR_STOP=1 -f database/08_upgrade_v4_2.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/integration_v42.sql
